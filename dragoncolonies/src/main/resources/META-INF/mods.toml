[[mods]]
modId="dragoncolonies"
version="${version}"
displayName="Dragon Colonies"
displayURL="https://www.n3g.de"
authors="Karl Karlmann"
logoFile="dragoncolonies.png"
description='''
Die ultimative Systemintegration von Book of Dragons und Minecolonies!
Ermöglicht euren Wachen das Reiten und Koordinieren von Drachen, führt eine spezialisierte Feuerwehr zur Brandbekämpfung ein und bietet mit dem Drachenhort (inkl. eigenem NPC-Drachenpfleger) eine brandneue Zucht- und Heilungsmechanik für das Ökosystem eurer Kolonie.
'''

# -------------------------------------------------------------------------
# ABHÄNGIGKEITEN (DEPENDENCIES)
# -------------------------------------------------------------------------

# 1. Forge API
[[dependencies.dragoncolonies]]
modId="forge"
mandatory=true
versionRange="[47.2.0,)"
ordering="NONE"
side="BOTH"

# 2. Minecraft Core
[[dependencies.dragoncolonies]]
modId="minecraft"
mandatory=true
versionRange="[1.20.1,1.21)"
ordering="NONE"
side="BOTH"

# 3. Minecolonies
[[dependencies.dragoncolonies]]
modId="minecolonies"
mandatory=true
versionRange="[1.1.4,)" # Platzhalter, bitte an die echte Minimum-Version anpassen
ordering="NONE"
side="BOTH"

# 4. Book of Dragons
[[dependencies.dragoncolonies]]
modId="bookofdragons" # Ggf. auf die exakte Mod-ID von Book of Dragons anpassen (z.B. bod, book_of_dragons etc.)
mandatory=true
versionRange="[1.0.0,)"
ordering="NONE"
side="BOTH"

# 5. Structurize (Zwingend für Minecolonies-Gebäude wie Feuerwache & Drachenhort)
[[dependencies.dragoncolonies]]
modId="structurize"
mandatory=true
versionRange="[1.0.0,)"
ordering="NONE"
side="BOTH"

# 6. BlockUI (Zwingend für die neuen UIs des Drachenzentrums)
[[dependencies.dragoncolonies]]
modId="blockui"
mandatory=true
versionRange="[1.0.0,)"
ordering="NONE"
side="BOTH"